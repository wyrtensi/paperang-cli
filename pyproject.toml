[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paperang-cli"
dynamic = ["version"]
description = "Standalone CLI for Paperang thermal printers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "wyrtensi" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Hardware :: Hardware Drivers",
]
dependencies = [
    "bleak>=0.22.0",
    "click>=8.1.7",
    "numpy>=1.26.0",
    "Pillow>=10.1.0",
    "paperang-p2-lib>=0.4.0rc3",
    "scikit-image>=0.20.0",
    "scipy>=1.11.0",
    "numba>=0.58.0",
    "pilkit>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
]
release = [
    "build>=1.2.2",
    "twine>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/wyrtensi/paperang-cli"
Documentation = "https://github.com/wyrtensi/paperang-cli/tree/main/docs"
Issues = "https://github.com/wyrtensi/paperang-cli/issues"
Source = "https://github.com/wyrtensi/paperang-cli"

[project.scripts]
paperang = "paperang_cli.cli:main"
paperang-cli = "paperang_cli.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paperang_cli = ["version-manifest.json"]

[tool.setuptools.dynamic]
version = {attr = "paperang_cli._version.__version__"}
