name: Publish Python package to PyPI

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - name: Install release tooling
        run: python -m pip install ".[release]"

      - name: Build wheel and sdist
        run: python -m build

      - name: Verify package version sources and release tag
        shell: python
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          from pathlib import Path
          import importlib.util
          import json
          import os

          package_version = json.loads(Path("src/paperang_cli/version-manifest.json").read_text(encoding="utf-8"))["version"]
          spec = importlib.util.spec_from_file_location("paperang_cli_version", Path("src/paperang_cli/_version.py"))
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)
          assert package_version == module.__version__, (package_version, module.__version__)

          release_tag = os.environ.get("RELEASE_TAG", "")
          if release_tag:
              assert release_tag == f"v{package_version}", (release_tag, package_version)

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distributions
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/paperang-cli
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
