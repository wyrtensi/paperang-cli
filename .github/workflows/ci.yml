name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Compatibility test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.10"
          - "3.12"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q tests

  package:
    name: Validate distributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - name: Install release tooling
        run: python -m pip install ".[release]"

      - name: Build wheel and sdist
        run: python -m build

      - name: Verify package version sources
        shell: python
        run: |
          from pathlib import Path
          import re
          import tomllib

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          package_version = project["project"]["version"]
          init_text = Path("src/paperang_cli/__init__.py").read_text(encoding="utf-8")
          init_version = re.search(r'__version__ = "([^"]+)"', init_text).group(1)
          assert package_version == init_version, (package_version, init_version)

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Verify wheel contents
        shell: python
        run: |
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels

          with ZipFile(wheels[0]) as archive:
              names = archive.namelist()
              assert any(name.endswith(".dist-info/licenses/LICENSE") for name in names)
              assert "paperang_cli/cli.py" in names
              assert "paperang_cli/config.py" in names

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
