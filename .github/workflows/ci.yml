name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Compatibility test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev bluez

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install libusb

      - name: Install package and test dependencies
        env:
          PAPERANG_CLI_SKIP_HARDWARE: "1"
        run: python -m pip install --pre -e ".[dev]"

      - name: Run tests
        env:
          PAPERANG_CLI_SKIP_HARDWARE: "1"
        run: python -m pytest -q tests

  package:
    name: Validate distributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - name: Install release tooling
        run: python -m pip install ".[release]"

      - name: Build wheel and sdist
        run: python -m build

      - name: Verify package version sources
        shell: python
        run: |
          from pathlib import Path
          import importlib.util
          import json

          package_version = json.loads(Path("src/paperang_cli/version-manifest.json").read_text(encoding="utf-8"))["version"]
          spec = importlib.util.spec_from_file_location("paperang_cli_version", Path("src/paperang_cli/_version.py"))
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)
          assert package_version == module.__version__, (package_version, module.__version__)

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Verify wheel contents
        shell: python
        run: |
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels

          with ZipFile(wheels[0]) as archive:
              names = archive.namelist()
              assert any(name.endswith(".dist-info/licenses/LICENSE") for name in names)
              assert "paperang_cli/cli.py" in names
              assert "paperang_cli/config.py" in names
              assert "paperang_cli/version-manifest.json" in names
              assert "paperang_cli/api/__init__.py" in names
              assert "paperang_cli/api/contract.py" in names
              assert "paperang_cli/api/p1.py" in names
              assert "paperang_cli/commands/api_cmd.py" in names

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  package-validate:
    name: Validate package on ${{ matrix.os }}
    needs: package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev bluez

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install libusb

      - name: Install wheel
        shell: bash
        run: python -m pip install dist/*.whl

      - name: Verify package
        shell: bash
        run: |
          python -m pip show paperang-cli
          python -c "import paperang_cli; print('Version:', paperang_cli.__version__)"
          paperang --version
          paperang --help
          python -c "from paperang_cli.protocol._capabilities import report; import json; print(json.dumps(report(), indent=2))"

      - name: Verify config path
        shell: python
        run: |
          from paperang_cli.config import default_config_path
          path = default_config_path()
          print(f"Config path: {path}")
          import sys
          if sys.platform == "win32":
              assert "AppData" in str(path) or "APPDATA" in str(path).upper()
          elif sys.platform == "darwin":
              assert "Library" in str(path) and "Application Support" in str(path)
          else:
              assert ".config" in str(path) or "XDG" in str(path)
          print("Config path OK")

  npm-wrapper:
    name: Validate npm wrapper on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Verify wrapper version sources
        shell: python
        run: |
          from pathlib import Path
          import importlib.util
          import json

          package_version = json.loads(Path("src/paperang_cli/version-manifest.json").read_text(encoding="utf-8"))["version"]
          spec = importlib.util.spec_from_file_location("paperang_cli_version", Path("src/paperang_cli/_version.py"))
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)
          wrapper = json.loads(Path("npm/package.json").read_text(encoding="utf-8"))

          assert package_version == module.__version__ == wrapper["version"]
          assert wrapper["paperangCli"]["pythonPackageVersion"] == package_version
          assert wrapper["repository"]["url"] == "git+https://github.com/wyrtensi/paperang-cli.git"

      - name: Install npm metadata
        working-directory: npm
        run: npm ci --ignore-scripts

      - name: Test npm wrapper
        working-directory: npm
        run: npm test

      - name: Verify npm package contents
        working-directory: npm
        run: npm pack --dry-run

  agent-skill:
    name: Validate Agent Skill
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - name: Install test tooling
        run: python -m pip install -e ".[dev]"

      - name: Validate skill and synchronized references
        run: python scripts/check-agent-skill.py

      - name: Test portable installer and skill checks
        run: python -m pytest -q tests/test_install_agent_skill.py tests/test_check_agent_skill.py

  smoke:
    name: Smoke test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev bluez
      - name: Install system dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install libusb
      - run: python -m pip install --pre .
      - name: Verify CLI entrypoints
        run: |
          paperang --version
          paperang --help
          python -c "import paperang_cli; print('imported OK', paperang_cli.__version__)"
      - name: Verify capability report
        run: |
          paperang --json capabilities
          python -c "from paperang_cli.protocol._capabilities import report; import json; print(json.dumps(report(), indent=2))"
